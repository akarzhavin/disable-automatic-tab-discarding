<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../static/css/theme.css" />
<link rel="stylesheet" href="../../static/css/popup.css" />
<style>
  *{animation:none!important;transition:none!important}
  html,body{background:transparent!important}
</style>
</head>
<body>
  <div class="app" id="app" data-enabled="true">
    <header class="header">
      <div class="brand">
        <img class="brand__logo" src="../../static/icons/icon48.png" alt="" width="22" height="22" />
        <span class="brand__name">Keep Tabs Alive</span>
      </div>
      <label class="switch switch--lg"><input type="checkbox" checked /><span class="switch__track"><span class="switch__thumb"></span></span></label>
    </header>
    <section class="card status">
      <div class="status__main">
        <span class="status__count">12</span>
        <span class="status__label">tabs protected</span>
      </div>
      <div class="status__pill"><span class="dot"></span><span>Protection on</span></div>
    </section>
    <section class="card site">
      <div class="ctl">
        <div class="ctl__text">
          <span class="ctl__head"><span class="ctl__label">This website</span><span class="ctl__scope ctl__scope--site">Permanent</span></span>
          <span class="ctl__value"><img class="ctl__favicon" src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'36'%20height%3D'36'%3E%3Crect%20width%3D'36'%20height%3D'36'%20rx%3D'8'%20fill%3D'%23111111'%2F%3E%3Ctext%20x%3D'18'%20y%3D'25'%20font-family%3D'-apple-system%2CArial'%20font-size%3D'20'%20font-weight%3D'700'%20fill%3D'%23fff'%20text-anchor%3D'middle'%3EN%3C%2Ftext%3E%3C%2Fsvg%3E" width="14" height="14" /><span>notion.so</span></span>
        </div>
        <label class="switch"><input type="checkbox" checked /><span class="switch__track"><span class="switch__thumb"></span></span></label>
      </div>
      <div class="ctl">
        <div class="ctl__text">
          <span class="ctl__head"><span class="ctl__label">This tab</span><span class="ctl__scope ctl__scope--tab">Temporary</span></span>
          <span class="ctl__value"><span>Weekly planning — Notion</span></span>
        </div>
        <label class="switch"><input type="checkbox" checked /><span class="switch__track"><span class="switch__thumb"></span></span></label>
      </div>
    </section>
    <section class="card note" data-state="on">
      <span class="note__icon"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="note__text">This tab is protected — Chrome won't discard it.</span>
    </section>
    <footer class="footer">
      <button class="link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="2"/><path d="M19.4 13a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 003.6 15a1.65 1.65 0 00-1.51-1H2a2 2 0 110-4h.09A1.65 1.65 0 003.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 008 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.2.6.74 1 1.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="2"/></svg><span>Settings &amp; statistics</span></button>
    </footer>
  </div>
</body></html>
